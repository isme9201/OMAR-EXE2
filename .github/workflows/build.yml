name: Build Avenmedia

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare draft release slot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="candidate-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ) ]]; then
            tag="v2.0.0-build-${GITHUB_RUN_NUMBER}"
          else
            tag=""
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create draft release for output assets
        if: steps.tag.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Avenmedia candidate $GITHUB_RUN_NUMBER" --notes "Automated candidate build. Manual workflow runs remain drafts until reviewed."

  build-windows:
    needs: [prepare-release]
    permissions:
      contents: write
    name: Build Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        shell: bash
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Debug - Find problematic JS files
        shell: bash
        run: |
          echo "🔍 جاري فحص ملفات الإعدادات بحثاً عن الخطأ النحوي..."
          for file in *.js; do
            if [ -f "$file" ]; then
              echo "📄 فحص الملف: $file"
              head -n 2 "$file"
              echo "------------------------"
            fi
          done
      - name: Build Web App
        run: pnpm build
      - name: Build Windows NSIS
        run: pnpm tauri build --bundles nsis
      - name: Package and upload Windows installer to draft release
        if: needs.prepare-release.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path release-packages -Force | Out-Null
          $files = Get-ChildItem -Path src-tauri/target -Recurse -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' }
          if (-not $files) { throw "No NSIS installer found" }
          Compress-Archive -Path $files.FullName -DestinationPath release-packages/Avenmedia-Windows-x64.zip -Force
          gh release upload $env:RELEASE_TAG release-packages/Avenmedia-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber

  build-macos:
    needs: [prepare-release]
    permissions:
      contents: write
    name: Build macOS DMG (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple-Silicon-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: Intel-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Web App
        run: pnpm build
      - name: Build macOS DMG
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Package and upload macOS DMG to draft release
        if: needs.prepare-release.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-packages
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          compgen -G "$dmg_dir/*.dmg" >/dev/null || { echo "No DMG found in $dmg_dir"; exit 1; }
          zip -q release-packages/Avenmedia-macOS-${{ matrix.label }}.zip "$dmg_dir"/*.dmg
          gh release upload "$RELEASE_TAG" release-packages/Avenmedia-macOS-${{ matrix.label }}.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    needs: [prepare-release]
    permissions:
      contents: write
    name: Build Linux DEB and AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        shell: bash
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Web App
        run: pnpm build
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,appimage
      - name: Package and upload Linux installers to draft release
        if: needs.prepare-release.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-packages/linux
          find src-tauri/target -type f \( -path '*/bundle/deb/*' -o -path '*/bundle/appimage/*' \) -exec cp {} release-packages/linux/ \;
          test -n "$(find release-packages/linux -type f -print -quit)"
          (cd release-packages/linux && zip -q -r ../Avenmedia-Linux-amd64.zip .)
          gh release upload "$RELEASE_TAG" release-packages/Avenmedia-Linux-amd64.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-web:
    needs: [prepare-release]
    permissions:
      contents: write
    name: Build web static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and test
        run: pnpm exec tsc --noEmit && pnpm test
      - name: Build web export
        run: pnpm build
      - name: Package and upload static web app to draft release
        if: needs.prepare-release.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd out && zip -q -r ../Avenmedia-Web.zip .)
          gh release upload "$RELEASE_TAG" Avenmedia-Web.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Publish successful main-branch release
    needs: [prepare-release, build-windows, build-macos, build-linux, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release after every package has uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "Avenmedia v2.0.0 build $GITHUB_RUN_NUMBER" --notes "Automated Avenmedia release with Windows NSIS, separate Apple Silicon and Intel macOS DMGs, Linux DEB/AppImage, and web static export."
