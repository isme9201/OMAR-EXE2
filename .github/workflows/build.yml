name: Build PhotoMedia ERP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        shell: bash
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Windows NSIS
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMedia-ERP-Windows-x64
          path: src-tauri/target/**/release/bundle/nsis/**
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build macOS DMG
        run: pnpm tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMedia-ERP-macOS
          path: src-tauri/target/**/release/bundle/dmg/**
          if-no-files-found: error
          compression-level: 0

  build-linux:
    name: Build Linux DEB and AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMedia-ERP-Linux-amd64
          path: |
            src-tauri/target/**/release/bundle/deb/**
            src-tauri/target/**/release/bundle/appimage/**
          if-no-files-found: error
          compression-level: 0

  build-web:
    name: Build web static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web export
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMedia-ERP-Web
          path: out/**
          if-no-files-found: error
          compression-level: 6

  publish-release:
    name: Publish release assets
    needs: [build-windows, build-macos, build-linux, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build-${{ github.run_number }}
          name: PhotoMedia ERP v2.0.0 build ${{ github.run_number }}
          body: |
            Automated PhotoMedia ERP release with Windows NSIS, macOS DMG, Linux DEB/AppImage, and web static export.
          draft: false
          prerelease: false
          files: release-assets/**/*
