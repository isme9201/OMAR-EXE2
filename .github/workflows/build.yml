name: Build Avenmedia

on:
  push:
    branches: [ "main", "master", "release/**" ]
  workflow_dispatch:
    inputs:
      include_linux:
        description: "Build Linux packages (the default is to skip Linux)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.0-build-${{ github.run_number }}

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Avenmedia v2.0.0 build ${{ github.run_number }}
          body: |
            Avenmedia cross-platform release from `${{ github.ref_name }}`.
            Includes the static web export and complete project source archive.
            macOS is ad-hoc signed until Apple Developer signing secrets are configured.
            Windows NSIS includes the offline WebView2 installer; the direct executable uses the system WebView2 runtime.
          draft: true
          prerelease: true

  build-windows:
    name: Build Windows x64 executable and NSIS
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        shell: bash
        run: pnpm tauri icon public/branding/aven-logo-512.png
      - name: Build Web App
        run: pnpm build
      - name: Build Windows x64 executable and NSIS
        run: pnpm tauri build --bundles nsis
      - name: Upload Windows executable and installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/*.exe
            src-tauri/target/**/release/bundle/nsis/*
          draft: true
          prerelease: true

  build-macos:
    name: Build macOS ${{ matrix.label }} DMG
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: Apple Silicon
          - runner: macos-15
            target: x86_64-apple-darwin
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon public/branding/aven-logo-512.png
      - name: Build Web App
        run: pnpm build
      - name: Build macOS DMG (ad-hoc until Apple certificate is configured)
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Upload macOS DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
          draft: true
          prerelease: true

  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_linux }}
    name: Build Linux DEB and AppImage
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon public/branding/aven-logo-512.png
      - name: Build Web App
        run: pnpm build
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,appimage
      - name: Upload Linux packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/deb/*
            src-tauri/target/**/release/bundle/appimage/*
          draft: true
          prerelease: true

  build-linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_linux }}
    name: Build Linux ARM64 DEB and AppImage
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdg-utils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon public/branding/aven-logo-512.png
      - name: Build Web App
        run: pnpm build
      - name: Build Linux ARM64 packages
        run: pnpm tauri build --bundles deb,appimage
      - name: Upload Linux ARM64 packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/deb/*
            src-tauri/target/**/release/bundle/appimage/*
          draft: true
          prerelease: true

  build-web:
    name: Build static web export and project ZIP
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web export
        run: pnpm build
      - name: Package web export and project source
        shell: bash
        run: |
          zip -qr Avenmedia-Web.zip out
          git archive --format=zip --output=Avenmedia-Project-Source.zip HEAD
      - name: Upload web export and project source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            Avenmedia-Web.zip
            Avenmedia-Project-Source.zip
          draft: true
          prerelease: true
