name: Build Avenmedia

on:
  push:
    branches: [ "main", "master", "release/**" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.0-build-${{ github.run_number }}

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Avenmedia v2.0.0 build ${{ github.run_number }}
          body: |
            Avenmedia cross-platform release from `${{ github.ref_name }}`.
            macOS is ad-hoc signed until Apple Developer signing secrets are configured.
            Windows is built on the native Windows runner.
          draft: true
          prerelease: true

  build-windows:
    name: Build Windows NSIS
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        shell: bash
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Web App
        run: pnpm build
      - name: Build Windows NSIS
        run: pnpm tauri build --bundles nsis
      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/nsis/*
          draft: true
          prerelease: true

  build-macos:
    name: Build macOS DMG
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Web App
        run: pnpm build
      - name: Build macOS DMG (ad-hoc until Apple certificate is configured)
        run: pnpm tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Upload macOS DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/dmg/*
          draft: true
          prerelease: true

  build-linux:
    name: Build Linux DEB and AppImage
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate valid Tauri icons
        run: pnpm tauri icon src-tauri/icons/source.svg
      - name: Build Web App
        run: pnpm build
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,appimage
      - name: Upload Linux packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/deb/*
            src-tauri/target/**/release/bundle/appimage/*
          draft: true
          prerelease: true

  build-web:
    name: Build web static export
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web export
        run: pnpm build
      - name: Package web export
        shell: bash
        run: zip -qr Avenmedia-Web.zip out
      - name: Upload web export to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Avenmedia-Web.zip
          draft: true
          prerelease: true
