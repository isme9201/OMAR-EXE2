<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Avenmedia | رفع الملفات</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#111b4e;background:#eef1ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#fff 0 15%,transparent 38%),linear-gradient(135deg,#eef1ff,#dce2ff)}main{width:min(680px,100%);background:#fff;border:1px solid #cbd3ff;border-radius:28px;box-shadow:0 24px 70px #27337a22;padding:32px}.brand{display:flex;align-items:center;gap:14px}.mark{width:52px;height:52px;border-radius:16px;background:#111b4e;color:#fff;display:grid;place-items:center;font-size:24px}.brand strong{font-size:27px}.brand small{display:block;color:#66709e;margin-top:4px}.line{height:4px;background:#7388ff;border-radius:9px;margin:24px 0}h1{font-size:32px;margin:0 0 12px}p{line-height:2;color:#5e6790}.meta{display:flex;justify-content:space-between;gap:12px;background:#f1f3ff;border:1px solid #d9deff;border-radius:14px;padding:12px;font-size:13px}.drop{display:grid;gap:10px;place-items:center;border:2px dashed #7388ff;border-radius:20px;padding:34px 20px;margin-top:20px;background:#f8f9ff;cursor:pointer}.drop input{display:none}.drop b{font-size:17px}.drop span{color:#6b7396;font-size:12px}.btn{width:100%;height:50px;border:0;border-radius:14px;background:#111b4e;color:#fff;font-weight:bold;font-size:15px;margin-top:16px;cursor:pointer}.btn:disabled{opacity:.5}.status{margin-top:18px;padding:14px;border-radius:14px;background:#eef8f2;color:#17623f;font-weight:bold;white-space:pre-wrap}.error{background:#fff0f0;color:#9b2020}.bar{height:8px;border-radius:8px;background:#e2e5f5;overflow:hidden;margin-top:15px}.bar i{display:block;height:100%;width:0;background:#7388ff;transition:width .2s}
  </style>
</head>
<body>
<main>
  <div class="brand"><div class="mark">✦</div><div><strong>Avenmedia</strong><small>رفع ملفات الزبون بجودة الأصل</small></div></div><div class="line"></div>
  <h1>ارفع ملفات مشروعك بأمان</h1><p>الرابط خاص بمشروع واحد. الملف يذهب مباشرة إلى التخزين ولا يتم كشف أي مفتاح سري داخل هذه الصفحة.</p>
  <div class="meta"><span>معرّف الرابط: <b id="tokenView">...</b></span><span id="expiry">رابط موقّع</span></div>
  <label class="drop"><b id="fileName">اختيار الصور أو الفيديو</b><span>يمكن اختيار أكثر من ملف · الدقة الأصلية محفوظة</span><input id="files" type="file" accept="image/*,video/*" multiple /></label>
  <button id="send" class="btn">رفع الملفات إلى Avenmedia</button><div class="bar"><i id="progress"></i></div><div id="status" class="status" hidden></div>
</main>
<script>
  // ضع قيمتك العامة فقط هنا. لا تضع CLOUDINARY_API_SECRET أبداً.
  const SUPABASE_URL = 'https://tgufcpgrbsaxccbkmvhx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRndWZjcGdyYnNheGNjYmttdmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODU4MDcsImV4cCI6MjEwMjk2MTgwN30.2WlPv_c3Y99n0rd5sFOn0B0xIVI2jxoRFA26gKunmMs';
  const token = new URLSearchParams(location.search).get('token') || '';
  const $ = id => document.getElementById(id); const files = $('files');
  $('tokenView').textContent = token ? token.slice(0,8) + '…' : 'غير موجود';
  function show(message, bad=false){ const el=$('status'); el.hidden=false; el.className='status'+(bad?' error':''); el.textContent=message; }
  files.addEventListener('change',()=>{ $('fileName').textContent=files.files.length ? `${files.files.length} ملف محدد` : 'اختيار الصور أو الفيديو'; });
  async function api(body){
    const response=await fetch(`${SUPABASE_URL}/functions/v1/cloudinary-upload`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},body:JSON.stringify(body)});
    const data=await response.json().catch(()=>({error:'استجابة غير صالحة'})); if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`); return data;
  }
  $('send').addEventListener('click',async()=>{
    if(!token){show('رابط الرفع غير صالح أو لا يحتوي token',true);return} if(!files.files.length){show('اختر ملفاً واحداً على الأقل',true);return}
    const button=$('send'); button.disabled=true; $('progress').style.width='2%'; show('جارٍ التحقق من الرابط وتجهيز الرفع...');
    try{
      for(let index=0;index<files.files.length;index++){
        const file=files.files[index]; const signed=await api({action:'sign_upload',token}); const form=new FormData(); form.append('file',file); form.append('api_key',signed.apiKey); form.append('timestamp',String(signed.timestamp)); form.append('signature',signed.signature); form.append('folder',signed.folder);
        const upload=await fetch(`https://api.cloudinary.com/v1_1/${signed.cloudName}/auto/upload`,{method:'POST',body:form}); const asset=await upload.json(); if(!upload.ok) throw new Error(asset.error?.message||'فشل رفع الملف إلى التخزين');
        await api({action:'complete_upload',token,asset}); $('progress').style.width=`${Math.round(((index+1)/files.files.length)*100)}%`; show(`تم رفع ${index+1} من ${files.files.length}: ${file.name}`);
      } show('اكتمل الرفع وحُفظت الملفات في Avenmedia. يمكنك إغلاق الصفحة.');
    }catch(error){ console.error('[Avenmedia][client-upload]',error); show(`تعذر إكمال الرفع:\n${error.message||error}`,true); } finally { button.disabled=false; }
  });
</script>
</body></html>
